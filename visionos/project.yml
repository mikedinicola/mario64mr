# Mario 64 MR for Apple Vision Pro. Mario64MR.xcodeproj is generated from this file (brew install xcodegen; cd
# visionos; xcodegen) and checked in, so building needs only Xcode. The game's libraries and data come from your ROM
# (python3 install_mario64mr.py <rom> --visionos fills Build/), never from the repository.
name: Mario64MR
options:
  bundleIdPrefix: local.mario64mr
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mario64MR:
    type: application
    platform: visionOS
    sources:
      - path: Mario64MR
      - path: Build/Data
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - framework: Build/Frameworks/SM64Game.xcframework
        embed: true
        codeSign: true
      - framework: Build/Frameworks/Goddard.xcframework
        embed: true
        codeSign: true
      - framework: Build/Frameworks/LibSM64.xcframework
        embed: true
        codeSign: true
      - sdk: GameController.framework
      - sdk: AVFAudio.framework
    info:
      path: Mario64MR/Info.plist
      properties:
        CFBundleDisplayName: Mario 64 MR
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MARIO64MR_BUNDLE_ID)
        SWIFT_OBJC_BRIDGING_HEADER: Mario64MR/Native/Mario64MR-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "7"
        GENERATE_INFOPLIST_FILE: false
        "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64  # (the libraries are built for Apple silicon only)
